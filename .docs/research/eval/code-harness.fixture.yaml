# Golden retrieval suite for this repository.
#
# Precondition: index first so a local Chroma/BM25/KG exists:
#   python main.py index .
# Then:
#   python main.py eval . --suite .docs/research/eval/code-harness.fixture.yaml
# Chroma vs TurboVec A/B (indexes both persist dirs; writes RESULTS.md):
#   python main.py eval-ab .
# Dry-run (no index required):
#   python main.py eval . --suite .docs/research/eval/code-harness.fixture.yaml --dry-run
#
# relevant_chunk_ids use stable parser entity ids. Chunk ids are
# `{entity_id}:{uuid}` and change on every re-index, so do not gold
# those UUIDs unless you just indexed and dump ids from a report.

suite: code-harness
k: 10
fixtures:
  - id: q-context-builder
    query: How does ContextBuilder assemble MMR context?
    relevant_chunk_ids:
      - class:harness/context_builder.py:ContextBuilder
      - method:harness/context_builder.py:ContextBuilder.build_context
    must_cite_paths:
      - harness/context_builder.py
    difficulty: easy

  - id: q-who-calls-index-chunks
    query: Who calls Retriever index_chunks?
    relevant_chunk_ids:
      - method:harness/retriever.py:Retriever.index_chunks
    must_cite_paths:
      - harness/retriever.py
    difficulty: hard

  - id: q-parser-discover
    query: How does CodeParser discover and parse repository files?
    relevant_chunk_ids:
      - class:harness/parser.py:CodeParser
      - func:harness/parser.py:discover_files
    must_cite_paths:
      - harness/parser.py
    difficulty: easy

  - id: q-chunker
    query: How does CodeChunker split entities into chunks?
    relevant_chunk_ids:
      - class:harness/chunker.py:CodeChunker
      - method:harness/chunker.py:CodeChunker.chunk_entities
    must_cite_paths:
      - harness/chunker.py
    difficulty: easy

  - id: q-cli-query
    query: Where is the query CLI command defined in main.py?
    relevant_chunk_ids:
      - func:main.py:cmd_query
    must_cite_paths:
      - main.py
    difficulty: medium

  - id: q-rrf-fusion
    query: How does reciprocal rank fusion combine dense and BM25 results?
    relevant_chunk_ids:
      - method:harness/retriever.py:Retriever._reciprocal_rank_fusion
      - method:harness/retriever.py:Retriever.retrieve
    must_cite_paths:
      - harness/retriever.py
    difficulty: medium

  - id: q-who-calls-build-context
    query: Who calls ContextBuilder.build_context?
    relevant_chunk_ids:
      - method:harness/context_builder.py:ContextBuilder.build_context
      - class:harness/context_builder.py:ContextBuilder
    must_cite_paths:
      - harness/context_builder.py
    difficulty: hard

  - id: q-what-exposes-query
    query: What CLI commands are exposed in main.py?
    relevant_chunk_ids:
      - func:main.py:cmd_query
      - file:main.py
    must_cite_paths:
      - main.py
    difficulty: hard
