      - class:harness/context_builder.py:ContextBuilder
    must_cite_paths:
      - harness/context_builder.py
    difficulty: hard

  - id: q-what-exposes-query
    query: What CLI commands are exposed in main.py?
    category: hard
    relevant_chunk_ids:
      - func:main.py:cmd_query
      - file:main.py
    must_cite_paths:
