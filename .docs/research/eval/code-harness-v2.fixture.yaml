# Golden retrieval suite v2 for this repository (40–50 queries).
#
# The original 8 fixtures from code-harness.fixture.yaml are the first
# eight rows, unchanged, so old Recall/nDCG numbers stay comparable.
#
# Extra field `category` is optional. load_suite ignores unknown keys on
# older harnesses; this file still scores. Categories used here:
#   symbol | nl | cross-file | cli | docs | hard | ticket
#
# Precondition: index first (local embeddings; no LLM key):
#   python3 main.py index .
# Then:
#   python3 main.py eval . --suite .docs/research/eval/code-harness-v2.fixture.yaml
# Dry-run (no index):
#   python3 main.py eval . --suite .docs/research/eval/code-harness-v2.fixture.yaml --dry-run
#
# relevant_chunk_ids use stable parser entity ids. Chunk ids are
# `{entity_id}:{uuid}` and change on every re-index.

suite: code-harness-v2
k: 10
fixtures:
  # --- original 8 (subset; keep ids/queries/labels byte-stable) ---
  - id: q-context-builder
    query: How does ContextBuilder assemble MMR context?
    category: nl
    relevant_chunk_ids:
      - class:harness/context_builder.py:ContextBuilder
      - method:harness/context_builder.py:ContextBuilder.build_context
    must_cite_paths:
      - harness/context_builder.py
    difficulty: easy

  - id: q-who-calls-index-chunks
    query: Who calls Retriever index_chunks?
    category: hard
    relevant_chunk_ids:
      - method:harness/retriever.py:Retriever.index_chunks
    must_cite_paths:
      - harness/retriever.py
    difficulty: hard

  - id: q-parser-discover
    query: How does CodeParser discover and parse repository files?
    category: nl
    relevant_chunk_ids:
      - class:harness/parser.py:CodeParser
