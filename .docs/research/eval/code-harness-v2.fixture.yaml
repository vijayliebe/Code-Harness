  # --- ticket-style (Jira-like body; labels are the files that would change) ---
  - id: q-ticket-rerank-crash
    query: >
      ABC-101: Cross-encoder rerank crashes when fused results are empty or
      the CE model fails to load. Guard _cross_encoder_rerank so a missing
      model or empty candidate list returns the original fused ranking
      instead of raising.
    category: ticket
    relevant_chunk_ids:
      - method:harness/retriever.py:Retriever._cross_encoder_rerank
    must_cite_paths:
      - harness/retriever.py
    difficulty: hard

  - id: q-ticket-packer-omit
    query: >
      ABC-102: CCR packer reports negative omitted line counts when first
      and last spans overlap on short chunks. pack_chunk should never emit
      "(-1 lines omitted)".
    category: ticket
    relevant_chunk_ids:
      - func:harness/ccr.py:pack_chunk
    must_cite_paths:
      - harness/ccr.py
    difficulty: medium

  - id: q-ticket-loop-oneshot
    query: >
      ABC-103: Corrective retrieve loop spends extra rounds when max_loops
      is 0. QueryLoop.run must keep the default path one retrieve plus pack.
    category: ticket
    relevant_chunk_ids:
      - class:harness/loop.py:QueryLoop
    must_cite_paths:
      - harness/loop.py
    difficulty: hard

  - id: q-ticket-redact-leak
    query: >
      ABC-104: Packed LLM context leaked an OpenAI sk- key. redact_text
      must catch sk- tokens and PEM private keys before context leaves
      the machine.
    category: ticket
    relevant_chunk_ids:
      - func:harness/redact.py:redact_text
    must_cite_paths:
      - harness/redact.py
    difficulty: medium

  - id: q-ticket-bm25-persist
    query: >
      ABC-105: After restart, BM25 index is empty even though Chroma has
      chunks. try_load_bm25 should restore the pickle next to the persist
      directory.
    category: ticket
    relevant_chunk_ids:
      - method:harness/retriever.py:Retriever.try_load_bm25
      - method:harness/retriever.py:Retriever.index_chunks
    must_cite_paths:
      - harness/retriever.py
    difficulty: medium

  - id: q-ticket-eval-uuid
    query: >
      ABC-106: Golden eval Recall@k is 0 after every re-index because
      fixtures gold the chunk UUID suffix. match_gold_id must treat entity
      ids as stable and ignore the trailing uuid.
    category: ticket
    relevant_chunk_ids:
      - func:harness/metrics.py:match_gold_id
    must_cite_paths:
      - harness/metrics.py
    difficulty: medium

  - id: q-ticket-serve-bind
    query: >
      ABC-107: serve bound 0.0.0.0 without auth. Default HTTP bind must
      stay 127.0.0.1 and require --allow-public for all-interfaces.
    category: ticket
    relevant_chunk_ids:
      - func:harness/serve.py:resolve_bind_host
      - class:harness/serve.py:BindError
    must_cite_paths:
      - harness/serve.py
    difficulty: medium
